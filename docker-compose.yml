services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shagan
      POSTGRES_PASSWORD: shagan
      POSTGRES_DB: shagan_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shagan -d shagan_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: shagan
      MINIO_ROOT_PASSWORD: shagan12345
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://shagan:shagan@postgres:5432/shagan_pos?sslmode=disable
      PORT: "8000"
      JWT_SECRET: changeme
      INTERNAL_API_KEY: changeme-internal-key
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: shagan
      STORAGE_SECRET_KEY: shagan12345
      STORAGE_BUCKET: shagan-pos-media
      STORAGE_USE_SSL: "false"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
